name: Build Tauri App Artifacts

on:
  push:
    tags:
      - 'v*' # Triggers on any 'v' tag
  
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual Version Override (MUST be a 3-point version, e.g., 0.9.1)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            os_name: macos
          - os: windows-latest
            os_name: windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: MotionView

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages
          pip install pyinstaller --break-system-packages
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: MotionView/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: MotionView/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Version & Inject into tauri.conf.json
        id: versioning
        run: |
          # 1. Figure out if this is a manual run or a git tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VERSION="v${{ github.event.inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # 2. STRICT REGEX CHECK: Must be exactly vX.Y.Z
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $RAW_VERSION. Must be a 3-point version like v0.9.1"
            exit 1
          fi

          # 3. Strip the 'v' to inject into Tauri (e.g., 0.9.1)
          APP_VERSION="${RAW_VERSION#v}"
          
          echo "Valid version detected: $RAW_VERSION"
          echo "tag_name=$RAW_VERSION" >> $GITHUB_OUTPUT
          
          # 4. Inject into tauri.conf.json
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path));
            if (config.package) config.package.version = '$APP_VERSION';
            config.version = '$APP_VERSION';
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "
        shell: bash

      - name: Build app
        run: pnpm build

      - name: Rename Output Binaries
        run: |
          TAG_NAME="${{ steps.versioning.outputs.tag_name }}"
          OS_NAME="${{ matrix.os_name }}"
          
          # Safe bash loop to rename the files properly on both Mac and Windows
          if [[ "$OS_NAME" == "macos" ]]; then
            for file in src-tauri/target/release/bundle/dmg/*.dmg; do
              if [ -f "$file" ]; then
                mv "$file" "$(dirname "$file")/motionview-${OS_NAME}_${TAG_NAME}.dmg"
              fi
            done
          elif [[ "$OS_NAME" == "windows" ]]; then
            # Windows might put the exe in one of two folders depending on the MSVC target
            for file in src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe; do
              if [ -f "$file" ]; then
                mv "$file" "$(dirname "$file")/motionview-${OS_NAME}_${TAG_NAME}.exe"
              fi
            done
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motionview-${{ matrix.os_name }}_${{ steps.versioning.outputs.tag_name }}
          path: |
            MotionView/src-tauri/target/release/bundle/dmg/*.dmg
            MotionView/src-tauri/target/release/bundle/nsis/*.exe
            MotionView/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          