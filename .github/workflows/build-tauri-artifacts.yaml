name: Build Tauri App Artifacts

on:
  push:
    tags:
      - 'v*' # Triggers on any 'v' tag, but the validate job will filter strictly
  
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual Version Override (MUST be SemVer, e.g., 0.9.1, 0.9.1-pre, or 0.9.1-beta.1)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release artifacts do not need write access to the repository. Keeping this
# explicit also prevents future workflow changes from inheriting broader token
# permissions.
permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.check.outputs.tag_name }}
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - name: Validate Version Format
        id: check
        run: |
          # Figure out if this is a manual run or a git tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VERSION="v${{ github.event.inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # Strict SemVer validation with an optional prerelease identifier.
          # Matches: vX.Y.Z, vX.Y.Z-pre, vX.Y.Z-beta.1, and vX.Y.Z-rc.2.
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version format: $RAW_VERSION. Must be vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

          # Strip the 'v' to inject into Tauri (e.g., 0.9.1 or 0.9.1-alpha)
          APP_VERSION="${RAW_VERSION#v}"
          
          echo "Valid version detected: $RAW_VERSION"
          echo "tag_name=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
        shell: bash

  build:
    needs: validate-version 
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            os_name: macos
            bundle_ext: dmg
            tauri_bundle: dmg
          - os: windows-latest
            os_name: windows
            bundle_ext: exe
            tauri_bundle: nsis
          - os: ubuntu-24.04
            os_name: linux
            bundle_ext: AppImage
            tauri_bundle: appimage

    runs-on: ${{ matrix.os }}

    # Only the macOS job receives the Developer ID and notarization secrets.
    # Configure the macos-release environment with required reviewers and
    # permitted release refs in the repository settings.
    environment:
      name: ${{ matrix.os_name == 'macos' && 'macos-release' || 'build' }}

    defaults:
      run:
        working-directory: MotionView

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages
          pip install pyinstaller --break-system-packages
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: MotionView/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
        shell: bash

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: MotionView/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject Validated Version into tauri.conf.json
        run: |
          # Use the sanitized app_version from the validate job
          APP_VERSION="${{ needs.validate-version.outputs.app_version }}"
          
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(path));
            if (config.package) config.package.version = '$APP_VERSION';
            config.version = '$APP_VERSION';
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "
        shell: bash

      - name: Validate macOS release credentials
        if: matrix.os_name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required_secret in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID; do
            if [[ -z "${!required_secret}" ]]; then
              echo "::error::The macos-release environment is missing $required_secret."
              exit 1
            fi
          done
        shell: bash

      - name: Import Apple Developer ID certificate
        if: matrix.os_name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/motionview-developer-id.p12"
          keychain_path="$RUNNER_TEMP/motionview-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | \
            grep -Fq "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "::error::The imported certificate does not match APPLE_SIGNING_IDENTITY."
            exit 1
          fi

          rm -f "$certificate_path"
          echo "MOTIONVIEW_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
        shell: bash

      - name: Build app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "${{ matrix.os_name }}" == "macos" ]]; then
            pnpm py:clean
            pnpm py:build
            bash scripts/sign_macos_runtime.sh "$APPLE_SIGNING_IDENTITY"
            pnpm tauri build --bundles "${{ matrix.tauri_bundle }}"
          elif [[ "${{ matrix.os_name }}" == "windows" ]]; then
            pnpm py:clean
            pnpm py:build
            pnpm tauri build --bundles "${{ matrix.tauri_bundle }}"
          elif [[ "${{ matrix.os_name }}" == "linux" ]]; then
            pnpm py:clean
            pnpm py:build
            pnpm tauri build --bundles "${{ matrix.tauri_bundle }}"
          else
            echo "::error::Unsupported OS name: ${{ matrix.os_name }}"
            exit 1
          fi
        shell: bash

      - name: Verify signed and notarized macOS artifacts
        if: matrix.os_name == 'macos'
        run: |
          set -euo pipefail
          app_bundle="$(find src-tauri/target -type d -path '*/bundle/macos/*.app' -print -quit)"
          dmg_path="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"

          if [[ -z "$app_bundle" || -z "$dmg_path" ]]; then
            echo "::error::Expected signed macOS app and DMG artifacts were not produced."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          spctl --assess --type execute --verbose=4 "$app_bundle"
          xcrun stapler validate "$dmg_path"
        shell: bash

      - name: Rename and Collect Output Binaries
        run: |
          TAG_NAME="${{ needs.validate-version.outputs.tag_name }}"
          OS_NAME="${{ matrix.os_name }}"
          BUNDLE_EXT="${{ matrix.bundle_ext }}"
          OUTPUT_PATH="src-tauri/artifacts/motionview-${OS_NAME}_${TAG_NAME}.${BUNDLE_EXT}"
          
          mkdir -p src-tauri/artifacts

          SOURCE_FILE="$(find src-tauri/target \
            -type f \
            -path '*/bundle/*' \
            -name "*.${BUNDLE_EXT}" \
            ! -name '*.sig' \
            ! -name '*.msi' \
            -print | head -n 1)"

          if [[ -z "$SOURCE_FILE" ]]; then
            echo "::error::No bundled .$BUNDLE_EXT artifact found for $OS_NAME under src-tauri/target"
            find src-tauri/target -maxdepth 6 -type f | sort | sed -n '1,200p'
            exit 1
          fi

          cp "$SOURCE_FILE" "$OUTPUT_PATH"
          ls -lah src-tauri/artifacts
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motionview-${{ matrix.os_name }}_${{ needs.validate-version.outputs.tag_name }}
          path: MotionView/src-tauri/artifacts
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always() && matrix.os_name == 'macos'
        run: |
          if [[ -n "${MOTIONVIEW_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MOTIONVIEW_SIGNING_KEYCHAIN" || true
          fi
        shell: bash
